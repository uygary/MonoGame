        working-directory: tests-desktopvk
        
      - name: Run Vulkan MemoryLifeCycle Tests
        if: runner.environment != 'github-hosted'
        run: dotnet test --filter Category=MemoryLifeCycle --blame-hang-timeout 5m MonoGame.Tests.dll
        env:
          CI: true
        working-directory: tests-desktopvk
        
      - name: Run Vulkan All Tests Except Audio, GraphicsDevice, MemoryLifeCycle
        if: runner.environment != 'github-hosted'
        run: dotnet test --filter "Category!=Audio&Category!=Song&Category!=GraphicsDevice&Category!=MemoryLifeCycle" --blame-hang-timeout 5m MonoGame.Tests.dll
